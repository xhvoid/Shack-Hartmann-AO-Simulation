name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Source-development gate: editable install from the checkout, running the
    # full native suite including the repository-structure tests.  It may use
    # editable installation but cannot substitute for the wheel gate below.
    name: Source development Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # Allow headroom for the full suite and a separate integration example
    # on shared hosted runners, whose simulation runtimes vary with load.
    timeout-minutes: 60
    env:
      PYTHONPATH: ""
      PIP_CONSTRAINT: ${{ github.workspace }}/${{ matrix.constraints }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            constraints: constraints/py310.txt
          - python-version: "3.14"
            constraints: constraints/py314.txt

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.constraints }}

      - name: Record canonical accepted-baseline hashes
        run: |
          git ls-files -z src/shwfs_ao/resources figures | sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/baselines-before.sha256"

      - name: Install dependencies
        run: python -m pip install -c "${{ matrix.constraints }}" -e ".[test]"

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Verify the environment is exactly the constraint lock
        run: python scripts/verify_environment_lock.py --constraints "${{ matrix.constraints }}"

      - name: Run tests
        # The hcipy marker is reserved for the dedicated HCIPy lane below;
        # --strict-markers comes from pyproject so an unregistered marker or
        # a typo cannot silently widen this selection.
        run: python -m pytest -q -m "not hcipy and not slow"

      - name: Run example scripts
        if: matrix.python-version == '3.14'
        # The demos default to the tracked figures/detector_level_SCAO, whose
        # files are not bit-portable: platform roundoff changes low bits and,
        # through the calibration hash in its noise-stream key, the centroid
        # demo's whole detector-noise draw. CI writes outside the checkout.
        run: |
          AO_DEMO_OUTPUT_DIR="$RUNNER_TEMP/ao-generated" python examples/run_psf_strehl_demo.py
          AO_DEMO_OUTPUT_DIR="$RUNNER_TEMP/ao-generated" python examples/run_shwfs_centroid_demo.py

      - name: Fast detector-level SCAO smoke
        if: matrix.python-version == '3.14'
        # Exercises the detector-level extension end-to-end, offline, from the
        # tracked public caches: the public-data overview (provenance summary +
        # photon budget) and the fast 2 m SCAO integration (error-budget table,
        # validation checks, and the small reference-metrics JSON).
        run: |
          AO_DEMO_OUTPUT_DIR="$RUNNER_TEMP/ao-generated" python examples/run_public_data_overview.py
          AO_DEMO_OUTPUT_DIR="$RUNNER_TEMP/ao-generated" \
            AO_DEMO_REFERENCE_METRICS="$RUNNER_TEMP/ao-generated/fast_reference_metrics.json" \
            python examples/run_fast_integration.py

      - name: Ensure generators did not modify tracked artifacts
        if: matrix.python-version == '3.14'
        run: git diff --exit-code -- src/shwfs_ao/resources/reference_metrics src/shwfs_ao/resources/resource_manifest.json figures/detector_level_SCAO

      - name: Enforce accepted baselines and a clean worktree
        # Both tracked edits and unexpected new files fail: no test, example,
        # or CI command may overwrite an accepted baseline.
        run: |
          git ls-files -z src/shwfs_ao/resources figures | sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/baselines-after.sha256"
          diff "$RUNNER_TEMP/baselines-before.sha256" "$RUNNER_TEMP/baselines-after.sha256"
          test -z "$(git status --porcelain --untracked-files=all)"

  wheel:
    # Wheel gate (AO-REF-020): scientific/runtime smoke tests, examples, and
    # packaging inspection must pass from a portable bundle against the built,
    # non-editable wheel, outside the source checkout.
    name: Wheel gate Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # Python 3.14 executes the complete integration twice: once as a bundle
    # example and once through the README. Both runs retain their full checks.
    timeout-minutes: 60
    env:
      PYTHONPATH: ""
      MPLBACKEND: Agg
      PIP_CONSTRAINT: ${{ github.workspace }}/${{ matrix.constraints }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            constraints: constraints/py310.txt
          - python-version: "3.14"
            constraints: constraints/py314.txt

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.constraints }}

      - name: Record canonical accepted-baseline hashes
        run: |
          git ls-files -z src/shwfs_ao/resources figures | sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/baselines-before.sha256"

      - name: Record the constraint profile hash
        run: sha256sum "${{ matrix.constraints }}"

      - name: Install build frontend
        run: python -m pip install -c "${{ matrix.constraints }}" build

      - name: Build wheel and sdist
        # mkdir without -p: the directory must not pre-exist, so the wheel
        # glob below resolves exactly once and build products never dirty
        # the checkout.
        run: |
          mkdir "$RUNNER_TEMP/dist"
          python -m build --outdir "$RUNNER_TEMP/dist"

      - name: Install the test and notebook-test dependency profile
        run: python -m pip install -c "${{ matrix.constraints }}" ".[test,notebook-test]"

      - name: Replace the source install with the built wheel
        run: |
          python -m pip uninstall -y shack-hartmann-ao-simulation
          python -m pip install --no-deps "$RUNNER_TEMP"/dist/*.whl
          python -m pip check

      - name: Verify the environment is exactly the constraint lock
        run: python scripts/verify_environment_lock.py --constraints "${{ matrix.constraints }}"

      - name: Rebuild a wheel from the sdist and inspect distribution contents
        # Clean-directory rebuild; the inspector compares file lists and the
        # canonical resource manifests, and asserts compatibility modules,
        # schemas, fixtures, and runtime resources are packaged.
        run: |
          mkdir "$RUNNER_TEMP/sdist-rebuild" "$RUNNER_TEMP/sdist-dist"
          tar -xf "$RUNNER_TEMP"/dist/*.tar.gz -C "$RUNNER_TEMP/sdist-rebuild" --strip-components=1
          (cd "$RUNNER_TEMP/sdist-rebuild" && python -m build --wheel --outdir "$RUNNER_TEMP/sdist-dist")
          python scripts/inspect_wheel_contents.py --wheel "$RUNNER_TEMP"/dist/*.whl --rebuilt-wheel "$RUNNER_TEMP"/sdist-dist/*.whl

      - name: Prepare the portable wheel-smoke bundle
        run: python scripts/prepare_wheel_smoke_bundle.py --output "$RUNNER_TEMP/wheel-smoke"

      - name: Run bundle tests and examples from the wheel
        # One step so `cd` persists.  The collection guard fails the job if
        # the native selection would silently collect zero tests; the bundle
        # is made read-only during pytest to prove resource loading needs
        # neither a writable checkout nor a .git directory.
        run: |
          cd "$RUNNER_TEMP/wheel-smoke"
          PYTHONPATH= python -m pytest -c pytest.ini -q --strict-markers -p no:cacheprovider --collect-only -m "not hcipy and not slow" tests > native-collection.txt
          test "$(grep -c '::' native-collection.txt)" -ge 1
          chmod -R a-w .
          PYTHONPATH= python -m pytest -c pytest.ini -q --strict-markers -p no:cacheprovider -m "not hcipy and not slow" tests
          chmod -R u+w .
          AO_DEMO_OUTPUT_DIR="$RUNNER_TEMP/ao-generated" PYTHONPATH= python examples/run_psf_strehl_demo.py
          AO_DEMO_OUTPUT_DIR="$RUNNER_TEMP/ao-generated" PYTHONPATH= python examples/run_shwfs_centroid_demo.py
          AO_DEMO_OUTPUT_DIR="$RUNNER_TEMP/ao-generated" PYTHONPATH= python examples/run_fast_integration.py

      - name: Execute README native commands from the clean wheel
        if: matrix.python-version == '3.14'
        run: |
          cd "$RUNNER_TEMP/wheel-smoke"
          PYTHONPATH= python scripts/run_readme_smoke.py --section native --require-wheel-bundle

      - name: Enforce accepted baselines and a clean worktree
        run: |
          git ls-files -z src/shwfs_ao/resources figures | sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/baselines-after.sha256"
          diff "$RUNNER_TEMP/baselines-before.sha256" "$RUNNER_TEMP/baselines-after.sha256"
          test -z "$(git status --porcelain --untracked-files=all)"

  hcipy:
    name: HCIPy Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ""
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints/hcipy-py311.txt
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints/hcipy-py311.txt

      - name: Record canonical accepted-baseline hashes
        run: |
          git ls-files -z src/shwfs_ao/resources figures | sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/baselines-before.sha256"

      - name: Install build frontend
        run: python -m pip install -c constraints/hcipy-py311.txt build

      - name: Build distributions
        run: |
          mkdir "$RUNNER_TEMP/dist"
          python -m build --outdir "$RUNNER_TEMP/dist"

      - name: Install test, HCIPy, and notebook-test dependencies
        run: python -m pip install -c constraints/hcipy-py311.txt ".[test,hcipy,notebook-test]"

      - name: Replace the source install with the built wheel
        run: |
          python -m pip uninstall -y shack-hartmann-ao-simulation
          python -m pip install --no-deps "$RUNNER_TEMP"/dist/*.whl
          python -m pip check

      - name: Verify the environment is exactly the constraint lock
        run: python scripts/verify_environment_lock.py --constraints constraints/hcipy-py311.txt

      - name: Prepare the portable wheel-smoke bundle
        run: python scripts/prepare_wheel_smoke_bundle.py --include-hcipy --output "$RUNNER_TEMP/wheel-smoke"

      - name: Run conversion and optional-import tests from the wheel
        # One step so `cd` persists; the collection guard fails the job if
        # the hcipy selection would silently collect zero tests.
        run: |
          cd "$RUNNER_TEMP/wheel-smoke"
          PYTHONPATH= python -m pytest -c pytest.ini -q --strict-markers --collect-only -m "hcipy and not slow" tests > hcipy-collection.txt
          test "$(grep -c '::' hcipy-collection.txt)" -ge 1
          PYTHONPATH= python -m pytest -c pytest.ini -q --strict-markers -m "hcipy and not slow" tests
          PYTHONPATH= python -m pytest -c pytest.ini -q --strict-markers -m "not hcipy and not slow" tests

      - name: Execute README HCIPy commands from the clean wheel
        run: |
          cd "$RUNNER_TEMP/wheel-smoke"
          PYTHONPATH= python scripts/run_readme_smoke.py --section hcipy --require-wheel-bundle

      - name: Allow the notebook lane to open a network namespace
        # Ubuntu's AppArmor policy can deny unprivileged user namespaces.
        # Enable the preferred path; the runner also supports passwordless
        # sudo for setup followed by a verified drop to the invoking user's
        # credentials with no capabilities. Neither path runs notebook code as
        # host root, but the isolation covers network interfaces only: host
        # services reachable through Unix sockets in the shared filesystem
        # (for example a Docker socket) are outside this contract. An image
        # without this knob needs no change.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "No AppArmor unprivileged-userns restriction on this image."
          fi

      - name: Register the kernel and smoke the HCIPy study notebook from the bundle
        run: |
          python -m ipykernel install --user --name python3
          cd "$RUNNER_TEMP/wheel-smoke"
          PYTHONPATH= python scripts/run_notebook_smoke.py --class hcipy

      - name: Enforce accepted baselines and a clean worktree
        run: |
          git ls-files -z src/shwfs_ao/resources figures | sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/baselines-after.sha256"
          diff "$RUNNER_TEMP/baselines-before.sha256" "$RUNNER_TEMP/baselines-after.sha256"
          test -z "$(git status --porcelain --untracked-files=all)"

  notebooks:
    name: Notebook smoke (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ""
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints/py314.txt
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: constraints/py314.txt

      - name: Record canonical accepted-baseline hashes
        run: |
          git ls-files -z src/shwfs_ao/resources figures | sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/baselines-before.sha256"

      - name: Install build frontend
        run: python -m pip install -c constraints/py314.txt build

      - name: Build distributions
        run: |
          mkdir "$RUNNER_TEMP/dist"
          python -m build --outdir "$RUNNER_TEMP/dist"

      - name: Install test and notebook-test dependencies
        run: python -m pip install -c constraints/py314.txt ".[test,notebook-test]"

      - name: Replace the source install with the built wheel
        # The notebooks must run from the installed package, never the source
        # tree; --no-deps install of the built wheel enforces that.
        run: |
          python -m pip uninstall -y shack-hartmann-ao-simulation
          python -m pip install --no-deps "$RUNNER_TEMP"/dist/*.whl
          python -m pip check

      - name: Verify the environment is exactly the constraint lock
        run: python scripts/verify_environment_lock.py --constraints constraints/py314.txt

      - name: Allow the notebook lane to open a network namespace
        # See the identical step in the hcipy-wheel job: ubuntu-latest is Ubuntu
        # 24.04, whose default AppArmor policy denies capabilities inside an
        # unprivileged user namespace. Enable the preferred path before the
        # governance tests as well as notebook execution; the sudo fallback
        # is exercised separately by the kernel integration test.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "No AppArmor unprivileged-userns restriction on this image."
          fi

      - name: Run notebook-governance tests
        # Static layout/manifest/rules tests read the checkout, so they run
        # here rather than from the bundle.
        run: python -m pytest -q -m "not hcipy and not slow" tests/notebooks

      - name: Prepare the portable wheel-smoke bundle
        run: python scripts/prepare_wheel_smoke_bundle.py --output "$RUNNER_TEMP/wheel-smoke"

      - name: Register the kernel
        run: python -m ipykernel install --user --name python3

      - name: Execute the fast tutorial notebooks from the bundle
        # MPLBACKEND=Agg, a fresh temporary working directory, per-cell plus
        # whole-notebook timeouts, and outbound-network denial (loopback kept
        # for the kernel) are enforced inside the smoke runner; running from
        # the bundle proves the notebooks need no source checkout or network.
        run: |
          cd "$RUNNER_TEMP/wheel-smoke"
          PYTHONPATH= python scripts/run_notebook_smoke.py --class fast

      - name: Execute the slow studies in their fast smoke parameterization
        # The representative fast parameterization promised by the notebook
        # manifest: FAST_SMOKE = True is injected after each study's tagged
        # parameters cell, so every slow study's full code path guards fast
        # CI while the scheduled lane executes the full-size study.
        run: |
          cd "$RUNNER_TEMP/wheel-smoke"
          PYTHONPATH= python scripts/run_notebook_smoke.py --class slow --fast-smoke

      - name: Enforce accepted baselines and a clean worktree
        run: |
          git ls-files -z src/shwfs_ao/resources figures | sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/baselines-after.sha256"
          diff "$RUNNER_TEMP/baselines-before.sha256" "$RUNNER_TEMP/baselines-after.sha256"
          test -z "$(git status --porcelain --untracked-files=all)"

  lint:
    name: Lint and static types (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ""
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints/py314.txt
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: constraints/py314.txt

      - name: Install lint tools
        run: python -m pip install -c constraints/py314.txt ".[lint]"

      - name: Verify the environment is exactly the constraint lock
        run: python scripts/verify_environment_lock.py --constraints constraints/py314.txt

      - name: Ruff correctness gate
        # Ruleset and per-file ignores are documented in [tool.ruff] in
        # pyproject.toml.
        run: python -m ruff check src examples scripts tests build_support

      - name: Scoped static type gate
        # [tool.mypy] checks the public protocols and unit-typed result
        # contracts under shwfs_ao.core, plus the public SCAO factory protocol
        # and both built-in backend factories.
        run: python -m mypy

      - name: No sys.path.insert in runtime code
        # Tests may insert temporary site directories for wheel validation and
        # the archived legacy notebooks are frozen evidence; everything else
        # must import the installed package.
        run: |
          ! git grep -n "sys\.path\.insert" -- '*.py' ':(exclude)tests' ':(exclude)notebooks/legacy'
