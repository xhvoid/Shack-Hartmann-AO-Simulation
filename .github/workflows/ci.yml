name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ""
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            constraints: constraints/py310.txt
          - python-version: "3.14"
            constraints: constraints/py314.txt

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.constraints }}

      - name: Install dependencies
        run: python -m pip install -c "${{ matrix.constraints }}" -e ".[test]"

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run tests
        # The hcipy marker is reserved for the dedicated HCIPy lane below;
        # --strict-markers comes from pyproject so an unregistered marker or
        # a typo cannot silently widen this selection.
        run: python -m pytest -q -m "not hcipy and not slow"

      - name: Run example scripts
        if: matrix.python-version == '3.14'
        run: |
          python examples/run_psf_strehl_demo.py
          python examples/run_shwfs_centroid_demo.py

      - name: Fast detector-level SCAO smoke
        if: matrix.python-version == '3.14'
        # Exercises the detector-level extension end-to-end, offline, from the
        # tracked public caches: the public-data overview (provenance summary +
        # photon budget) and the fast 2 m SCAO integration (error-budget table,
        # validation checks, and the small reference-metrics JSON).
        run: |
          AO_DEMO_OUTPUT_DIR="$RUNNER_TEMP/ao-generated" python examples/run_public_data_overview.py
          AO_DEMO_OUTPUT_DIR="$RUNNER_TEMP/ao-generated" \
            AO_DEMO_REFERENCE_METRICS="$RUNNER_TEMP/ao-generated/fast_reference_metrics.json" \
            python examples/run_fast_integration.py

      - name: Ensure generators did not modify tracked artifacts
        if: matrix.python-version == '3.14'
        run: git diff --exit-code -- src/shwfs_ao/resources/reference_metrics src/shwfs_ao/resources/resource_manifest.json figures/detector_level_SCAO

  hcipy:
    name: HCIPy Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints/hcipy-py311.txt

      - name: Install build frontend
        run: python -m pip install -c constraints/hcipy-py311.txt build

      - name: Build distributions
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          python -m build --outdir "$RUNNER_TEMP/dist"

      - name: Install test and HCIPy dependencies
        run: python -m pip install -c constraints/hcipy-py311.txt ".[test,hcipy]"

      - name: Replace the source install with the built wheel
        run: |
          python -m pip uninstall -y shack-hartmann-ao-simulation
          python -m pip install --no-deps "$RUNNER_TEMP"/dist/*.whl
          python -m pip check

      - name: Prepare the portable wheel-smoke bundle
        run: python scripts/prepare_wheel_smoke_bundle.py --include-hcipy --output "$RUNNER_TEMP/wheel-smoke"

      - name: Run conversion and optional-import tests from the wheel
        # One step so `cd` persists; the collection guard fails the job if
        # the hcipy selection would silently collect zero tests.
        run: |
          cd "$RUNNER_TEMP/wheel-smoke"
          PYTHONPATH= python -m pytest -c pytest.ini -q --strict-markers --collect-only -m "hcipy and not slow" tests > hcipy-collection.txt
          test "$(grep -c '::' hcipy-collection.txt)" -ge 1
          PYTHONPATH= python -m pytest -c pytest.ini -q --strict-markers -m "hcipy and not slow" tests
          PYTHONPATH= python -m pytest -c pytest.ini -q --strict-markers -m "not hcipy and not slow" tests
