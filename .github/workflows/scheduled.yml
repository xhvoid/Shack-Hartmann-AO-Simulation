name: scheduled

# Slow studies and the fuller HCIPy sweep run on a weekly schedule (plus
# manual dispatch) and report separately from the required fast correctness
# jobs in ci.yml: a failure here never hides a native regression, and the
# fast gates never wait on a slow study.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow-native:
    name: Slow native studies (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ""
      MPLBACKEND: Agg
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints/py314.txt
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: constraints/py314.txt

      - name: Record canonical accepted-baseline hashes
        run: |
          find src/shwfs_ao/resources figures -type f -print0 | sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/baselines-before.sha256"

      - name: Install build frontend
        run: python -m pip install -c constraints/py314.txt build

      - name: Build distributions
        run: |
          mkdir "$RUNNER_TEMP/dist"
          python -m build --outdir "$RUNNER_TEMP/dist"

      - name: Install test and notebook-test dependencies
        run: python -m pip install -c constraints/py314.txt ".[test,notebook-test]"

      - name: Replace the source install with the built wheel
        # AO-REF-019: notebooks execute against the installed wheel, never an
        # editable source tree, in the scheduled lane exactly as in fast CI.
        run: |
          python -m pip uninstall -y shack-hartmann-ao-simulation
          python -m pip install --no-deps "$RUNNER_TEMP"/dist/*.whl
          python -m pip check

      - name: Verify the environment is exactly the constraint lock
        run: python scripts/verify_environment_lock.py --constraints constraints/py314.txt

      - name: Run slow-marked native tests when any exist
        # The physical-atmosphere and accepted-baseline reruns live here.  Keep
        # the collection guard so a future refactor cannot silently turn the
        # scheduled test selection into an empty success.
        run: |
          count="$(python -m pytest -q --collect-only -m "slow and not hcipy" | grep -c '::' || true)"
          if [ "$count" -gt 0 ]; then
            python -m pytest -q -m "slow and not hcipy"
          else
            echo "No slow-marked native tests yet; the slow studies below are the slow selection."
          fi

      - name: Prepare the portable wheel-smoke bundle
        run: python scripts/prepare_wheel_smoke_bundle.py --output "$RUNNER_TEMP/wheel-smoke"

      - name: Allow the notebook lane to open a network namespace
        # ubuntu-latest is Ubuntu 24.04, whose default AppArmor policy denies
        # capabilities inside an unprivileged user namespace, so the smoke
        # runner's required network isolation is otherwise unobtainable and the
        # step below aborts. See the matching step in ci.yml.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "No AppArmor unprivileged-userns restriction on this image."
          fi

      - name: Register the kernel
        run: python -m ipykernel install --user --name python3

      - name: Execute the full slow study notebooks from the bundle
        run: |
          cd "$RUNNER_TEMP/wheel-smoke"
          PYTHONPATH= python scripts/run_notebook_smoke.py --class slow --cell-timeout 600 --notebook-budget 1800

      - name: Enforce accepted baselines and a clean worktree
        run: |
          find src/shwfs_ao/resources figures -type f -print0 | sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/baselines-after.sha256"
          diff "$RUNNER_TEMP/baselines-before.sha256" "$RUNNER_TEMP/baselines-after.sha256"
          test -z "$(git status --porcelain --untracked-files=all)"

  full-hcipy:
    name: Full HCIPy sweep (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ""
      MPLBACKEND: Agg
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints/hcipy-py311.txt
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints/hcipy-py311.txt

      - name: Record canonical accepted-baseline hashes
        run: |
          find src/shwfs_ao/resources figures -type f -print0 | sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/baselines-before.sha256"

      - name: Install build frontend
        run: python -m pip install -c constraints/hcipy-py311.txt build

      - name: Build distributions
        run: |
          mkdir "$RUNNER_TEMP/dist"
          python -m build --outdir "$RUNNER_TEMP/dist"

      - name: Install test, HCIPy, and notebook-test dependencies
        run: python -m pip install -c constraints/hcipy-py311.txt ".[test,hcipy,notebook-test]"

      - name: Replace the source install with the built wheel
        # AO-REF-019: the full sweep runs against the installed wheel, never
        # an editable source tree, in the scheduled lane exactly as in fast CI.
        run: |
          python -m pip uninstall -y shack-hartmann-ao-simulation
          python -m pip install --no-deps "$RUNNER_TEMP"/dist/*.whl
          python -m pip check

      - name: Verify the environment is exactly the constraint lock
        run: python scripts/verify_environment_lock.py --constraints constraints/hcipy-py311.txt

      - name: Run every HCIPy test including slow ones
        # The collection guard fails the job if the full hcipy selection
        # would silently collect zero tests.
        run: |
          python -m pytest -q --collect-only -m "hcipy" > hcipy-full-collection.txt
          test "$(grep -c '::' hcipy-full-collection.txt)" -ge 1
          rm hcipy-full-collection.txt
          python -m pytest -q -m "hcipy"

      - name: Prepare the portable wheel-smoke bundle
        run: python scripts/prepare_wheel_smoke_bundle.py --include-hcipy --output "$RUNNER_TEMP/wheel-smoke"

      - name: Allow the notebook lane to open a network namespace
        # ubuntu-latest is Ubuntu 24.04, whose default AppArmor policy denies
        # capabilities inside an unprivileged user namespace, so the smoke
        # runner's required network isolation is otherwise unobtainable and the
        # step below aborts. See the matching step in ci.yml.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "No AppArmor unprivileged-userns restriction on this image."
          fi

      - name: Register the kernel and smoke the HCIPy study notebook from the bundle
        run: |
          python -m ipykernel install --user --name python3
          cd "$RUNNER_TEMP/wheel-smoke"
          PYTHONPATH= python scripts/run_notebook_smoke.py --class hcipy

      - name: Enforce accepted baselines and a clean worktree
        run: |
          find src/shwfs_ao/resources figures -type f -print0 | sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/baselines-after.sha256"
          diff "$RUNNER_TEMP/baselines-before.sha256" "$RUNNER_TEMP/baselines-after.sha256"
          test -z "$(git status --porcelain --untracked-files=all)"
