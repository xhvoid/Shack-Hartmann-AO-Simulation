name: scheduled

# Slow studies and the fuller HCIPy sweep run on a weekly schedule (plus
# manual dispatch) and report separately from the required fast correctness
# jobs in ci.yml: a failure here never hides a native regression, and the
# fast gates never wait on a slow study.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow-native:
    name: Slow native studies (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ""
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: constraints/py314.txt

      - name: Record canonical accepted-baseline hashes
        run: |
          find src/shwfs_ao/resources figures -type f -print0 | sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/baselines-before.sha256"

      - name: Install dependencies
        run: python -m pip install -c constraints/py314.txt -e ".[test,notebook-test]"

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run slow-marked native tests when any exist
        # The slow marker is registered but currently carried only by the
        # study notebooks below; this step activates automatically once a
        # slow-marked test lands, instead of tripping a zero-collection guard.
        run: |
          count="$(python -m pytest -q --collect-only -m "slow and not hcipy" | grep -c '::' || true)"
          if [ "$count" -gt 0 ]; then
            python -m pytest -q -m "slow and not hcipy"
          else
            echo "No slow-marked native tests yet; the slow studies below are the slow selection."
          fi

      - name: Register the kernel
        run: python -m ipykernel install --user --name python3

      - name: Execute the slow study notebooks
        run: python scripts/run_notebook_smoke.py --class slow --cell-timeout 600 --notebook-budget 1800

      - name: Enforce accepted baselines and a clean worktree
        run: |
          find src/shwfs_ao/resources figures -type f -print0 | sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/baselines-after.sha256"
          diff "$RUNNER_TEMP/baselines-before.sha256" "$RUNNER_TEMP/baselines-after.sha256"
          test -z "$(git status --porcelain --untracked-files=all)"

  full-hcipy:
    name: Full HCIPy sweep (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ""
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints/hcipy-py311.txt

      - name: Record canonical accepted-baseline hashes
        run: |
          find src/shwfs_ao/resources figures -type f -print0 | sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/baselines-before.sha256"

      - name: Install dependencies
        run: python -m pip install -c constraints/hcipy-py311.txt -e ".[test,hcipy,notebook-test]"

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run every HCIPy test including slow ones
        # The collection guard fails the job if the full hcipy selection
        # would silently collect zero tests.
        run: |
          python -m pytest -q --collect-only -m "hcipy" > hcipy-full-collection.txt
          test "$(grep -c '::' hcipy-full-collection.txt)" -ge 1
          rm hcipy-full-collection.txt
          python -m pytest -q -m "hcipy"

      - name: Register the kernel and smoke the HCIPy study notebook
        run: |
          python -m ipykernel install --user --name python3
          python scripts/run_notebook_smoke.py --class hcipy

      - name: Enforce accepted baselines and a clean worktree
        run: |
          find src/shwfs_ao/resources figures -type f -print0 | sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/baselines-after.sha256"
          diff "$RUNNER_TEMP/baselines-before.sha256" "$RUNNER_TEMP/baselines-after.sha256"
          test -z "$(git status --porcelain --untracked-files=all)"
