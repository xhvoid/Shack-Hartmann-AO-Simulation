# Fast 2 m SCAO config skeleton with units, source_class tags, and source notes for every physical parameter group.
schema_version: 0.1
preset_name: ao_demo_2m_fast
preset_role: Lightweight CI smoke run; full detector-level realism at reduced scale.

telescope:
  diameter_m: {value: 2.0, unit: m, source_class: synthetic_assumed, source_note: "2 m-class tractable SCAO demonstrator scale selected for this preset."}
  central_obstruction_ratio: {value: 0.0, unit: dimensionless, source_class: synthetic_assumed, source_note: "Fast preset uses an unobscured circular pupil; replace with instrument-specific geometry in later studies."}
  spider_width_m: {value: 0.0, unit: m, source_class: synthetic_assumed, source_note: "No spiders in fast preset to keep pupil diagnostics simple."}
  pupil_sampling_px: {value: 128, unit: pixel, source_class: synthetic_assumed, source_note: "Fast preset sampling: N_pupil 128-160."}
  pupil_rotation_deg: {value: 0.0, unit: deg, source_class: synthetic_assumed, source_note: "No pupil rotation in baseline fast preset."}
  pupil_shift_x_frac: {value: 0.0, unit: pupil_diameter_fraction, source_class: synthetic_assumed, source_note: "No pupil shift in baseline fast preset."}
  pupil_shift_y_frac: {value: 0.0, unit: pupil_diameter_fraction, source_class: synthetic_assumed, source_note: "No pupil shift in baseline fast preset."}
  science_field_angle_arcsec: {value: 0.0, unit: arcsec, source_class: synthetic_assumed, source_note: "On-axis SCAO baseline; anisoplanatism deferred."}

atmosphere:
  seeing_arcsec_500nm: {value: 0.8, unit: arcsec, source_class: synthetic_literature_inspired, source_note: "Representative median seeing scenario; r0 conversion uses Fried DOI 10.1364/JOSA.56.001372."}
  r0_500_m: {value: 0.126, unit: m, source_class: synthetic_literature_inspired, source_note: "Approximate value from r0=0.98*lambda/seeing at 500 nm for 0.8 arcsec; recompute if the adopted seeing changes."}
  outer_scale_L0_m: {value: 25.0, unit: m, source_class: synthetic_literature_inspired, source_note: "Typical finite outer-scale placeholder; replace with ASM/literature profile if available."}
  tau0_s: {value: 0.003, unit: s, source_class: synthetic_literature_inspired, source_note: "Representative coherence time placeholder; Greenwood temporal reference DOI 10.1364/JOSA.67.000390."}
  theta0_arcsec: {value: 2.0, unit: arcsec, source_class: synthetic_literature_inspired, source_note: "Representative isoplanatic-angle placeholder; replace with direct/literature profile later."}
  seed: {value: 1101, unit: dimensionless, source_class: synthetic_assumed, source_note: "Deterministic fast-mode atmosphere seed."}
  layers:
    - height_m: {value: 0.0, unit: m, source_class: synthetic_literature_inspired, source_note: "Ground-layer fallback inspired by Paranal turbulence-profile literature arXiv:1806.02585."}
      cn2_weight: {value: 0.55, unit: fraction, source_class: synthetic_literature_inspired, source_note: "Synthetic normalized layer weight; weights must sum to one."}
      wind_ms: {value: 5.0, unit: m/s, source_class: synthetic_assumed, source_note: "Synthetic fast-mode wind speed."}
      wind_dir_deg: {value: 0.0, unit: deg, source_class: synthetic_assumed, source_note: "Synthetic wind direction measured counter-clockwise from +x."}
    - height_m: {value: 5000.0, unit: m, source_class: synthetic_literature_inspired, source_note: "Mid-altitude fallback layer inspired by published MASS/SCIDAR turbulence-profile literature."}
      cn2_weight: {value: 0.30, unit: fraction, source_class: synthetic_literature_inspired, source_note: "Synthetic normalized layer weight; weights must sum to one."}
      wind_ms: {value: 12.0, unit: m/s, source_class: synthetic_assumed, source_note: "Synthetic fast-mode wind speed."}
      wind_dir_deg: {value: 60.0, unit: deg, source_class: synthetic_assumed, source_note: "Synthetic wind direction measured counter-clockwise from +x."}
    - height_m: {value: 12000.0, unit: m, source_class: synthetic_literature_inspired, source_note: "High-altitude fallback layer inspired by published MASS/SCIDAR turbulence-profile literature."}
      cn2_weight: {value: 0.15, unit: fraction, source_class: synthetic_literature_inspired, source_note: "Synthetic normalized layer weight; weights must sum to one."}
      wind_ms: {value: 25.0, unit: m/s, source_class: synthetic_assumed, source_note: "Synthetic fast-mode wind speed."}
      wind_dir_deg: {value: 120.0, unit: deg, source_class: synthetic_assumed, source_note: "Synthetic wind direction measured counter-clockwise from +x."}

wfs:
  n_lenslets: {value: 10, unit: subapertures_across_pupil, source_class: synthetic_assumed, source_note: "Fast preset sampling: N_subap 10-12."}
  wavelength_m: {value: 7.0e-7, unit: m, source_class: synthetic_assumed, source_note: "Visible/NIR guide-star WFS wavelength placeholder."}
  min_fill_fraction: {value: 0.35, unit: fraction, source_class: synthetic_assumed, source_note: "Valid subaperture fill threshold; edge treatment is documented with the analysis results."}
  detector_pad_factor: {value: 3, unit: dimensionless, source_class: synthetic_assumed, source_note: "Reduced pad factor for fast detector-level lenslet spot generation."}
  detector_window_px: {value: 24, unit: pixel, source_class: synthetic_assumed, source_note: "Finite detector window per lenslet in fast mode."}
  threshold_fraction: {value: 0.0, unit: fraction_of_peak, source_class: synthetic_assumed, source_note: "No threshold in baseline fast preset; threshold bias tested later."}

detector:
  photons_per_subap_frame: {value: 5000.0, unit: photon/subap/frame, source_class: synthetic_assumed, source_note: "Synthetic guide-star photon budget for fast mode; catalog-based conversion is outside this preset."}
  qe: {value: 0.8, unit: electron/photon, source_class: synthetic_assumed, source_note: "Synthetic detector QE placeholder."}
  throughput: {value: 0.35, unit: dimensionless, source_class: synthetic_assumed, source_note: "Synthetic grey WFS throughput placeholder."}
  read_noise_e: {value: 1.5, unit: electron_rms, source_class: synthetic_assumed, source_note: "Low-noise detector placeholder."}
  dark_e_per_s: {value: 0.02, unit: electron/s/pixel, source_class: synthetic_assumed, source_note: "Synthetic dark current placeholder."}
  background_e: {value: 0.05, unit: electron/pixel/frame, source_class: synthetic_assumed, source_note: "Synthetic detector background placeholder."}
  full_well_e: {value: 30000.0, unit: electron, source_class: synthetic_assumed, source_note: "Synthetic full-well limit for saturation diagnostics."}
  prnu_rms: {value: 0.005, unit: fraction, source_class: synthetic_assumed, source_note: "Synthetic PRNU placeholder."}
  bad_pixel_fraction: {value: 0.001, unit: fraction, source_class: synthetic_assumed, source_note: "Synthetic bad-pixel fraction placeholder."}

dm:
  n_actuators_across: {value: 11, unit: actuators_across_pupil, source_class: synthetic_assumed, source_note: "Fast preset sampling: N_act 11-13."}
  influence_model: {value: gaussian, unit: model_name, source_class: synthetic_literature_inspired, source_note: "Gaussian influence baseline motivated by synthetic DM modelling references such as Berdeu arXiv:2306.10803."}
  coupling_width_pitch: {value: 0.35, unit: actuator_pitch_fraction, source_class: synthetic_literature_inspired, source_note: "Synthetic literature-inspired Gaussian coupling width."}
  stroke_limit_nm: {value: 800.0, unit: nm_OPD_equivalent, source_class: synthetic_assumed, source_note: "Synthetic fast-mode stroke limit for saturation diagnostics."}
  dead_actuator_fraction: {value: 0.0, unit: fraction, source_class: synthetic_assumed, source_note: "No dead actuators in fast baseline; enabled in error-budget scenarios."}

registration:
  shift_x_frac: {value: 0.0, unit: subaperture_pitch_fraction, source_class: synthetic_assumed, source_note: "Perfect WFS-DM registration in baseline fast preset."}
  shift_y_frac: {value: 0.0, unit: subaperture_pitch_fraction, source_class: synthetic_assumed, source_note: "Perfect WFS-DM registration in baseline fast preset."}
  rotation_deg: {value: 0.0, unit: deg, source_class: synthetic_assumed, source_note: "Perfect WFS-DM registration in baseline fast preset."}
  magnification: {value: 1.0, unit: dimensionless, source_class: synthetic_assumed, source_note: "Perfect WFS-DM scale in baseline fast preset."}
  shear: {value: 0.0, unit: dimensionless, source_class: synthetic_assumed, source_note: "No WFS-DM shear in baseline fast preset."}

control:
  calibration_amplitude_rad: {value: 0.001, unit: rad_at_wfs_wavelength, source_class: synthetic_assumed, source_note: "Detector-level central-difference poke amplitude; re-scan when the detector or DM configuration changes."}
  tsvd_rcond_initial: {value: 0.01, unit: dimensionless, source_class: synthetic_assumed, source_note: "Initial placeholder only; the notebook 09 rcond must not be copied without a fresh scan."}
  gain_initial: {value: 0.35, unit: dimensionless, source_class: synthetic_assumed, source_note: "Initial integrator gain for fast preset; scan when the loop configuration changes."}
  leak: {value: 0.01, unit: dimensionless_per_frame, source_class: synthetic_assumed, source_note: "Small command leak for integrator stability diagnostics."}
  frame_rate_hz: {value: 1000.0, unit: Hz, source_class: synthetic_assumed, source_note: "Nominal 1 kHz loop used to label frame delay as physical latency."}
  latency_frames: {value: 1, unit: frame, source_class: synthetic_assumed, source_note: "Synthetic one-frame delay baseline."}
  n_steps: {value: 45, unit: frame, source_class: synthetic_assumed, source_note: "Fast preset loop length from task requirement range 40-60."}
  settling_frames: {value: 15, unit: frame, source_class: synthetic_assumed, source_note: "Frames skipped before tail metrics."}

science:
  wavelengths_m: {J: 1.25e-6, H: 1.65e-6, K: 2.20e-6, unit: m, source_class: synthetic_assumed, source_note: "Monochromatic J/H/K fallback; direct SVO curves are an optional extension."}
  bandpass_mode: {value: monochromatic_fallback, unit: mode_name, source_class: synthetic_assumed, source_note: "No internet required for fast mode; SVO direct_public_data support added later."}
  science_pixel_scale_mas: {value: 25.0, unit: mas/pixel, source_class: synthetic_assumed, source_note: "Synthetic Nyquist-ish sampling placeholder for 2 m NIR PSFs."}
  science_fov_arcsec: {value: 2.0, unit: arcsec, source_class: synthetic_assumed, source_note: "Compact PSF diagnostic field of view."}
  exposure_s: {value: 1.0, unit: s, source_class: synthetic_assumed, source_note: "Synthetic science exposure time placeholder."}

source:
  guide_star_mag_r: {value: 9.0, unit: mag, source_class: synthetic_assumed, source_note: "Synthetic guide-star magnitude; catalog loaders are not part of this preset."}
  spectrum_model: {value: flat_photon_flux, unit: model_name, source_class: synthetic_assumed, source_note: "Simple fast-mode photon-budget placeholder."}
  airmass: {value: 1.2, unit: dimensionless, source_class: synthetic_assumed, source_note: "Synthetic observing airmass placeholder."}

static_aberration:
  ncpa_low_order_rms_nm: {value: 30.0, unit: nm_OPD, source_class: synthetic_literature_inspired, source_note: "Synthetic NCPA scenario using literature-informed 30/60/100 nm RMS presets."}
  ncpa_mid_spatial_rms_nm: {value: 15.0, unit: nm_OPD, source_class: synthetic_assumed, source_note: "Synthetic mid-spatial phase map placeholder."}
  seed: {value: 2101, unit: dimensionless, source_class: synthetic_assumed, source_note: "Deterministic NCPA seed."}

archive_validation:
  external_archive_mode: {value: output_level_psf_comparison_only, unit: mode_name, source_class: synthetic_assumed, source_note: "Public archive images may support output-level PSF comparison but cannot validate internal AO telemetry."}
  public_frame_source: {value: not_selected, unit: dataset_name, source_class: synthetic_assumed, source_note: "No direct_public_data archive frame is selected; record a URL, access time, and source note if one is added."}
  comparison_metrics: {value: fwhm_ee_strehl_proxy, unit: metric_set, source_class: synthetic_assumed, source_note: "Placeholder metric set for later output-level sanity checks."}

caching:
  enabled: {value: true, unit: boolean, source_class: synthetic_assumed, source_note: "Caching schema; every cache must include a config hash."}
  cache_dir: {value: data/cache, unit: path, source_class: synthetic_assumed, source_note: "Generated caches are ignored by git except .gitkeep."}
