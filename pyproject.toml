[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shack-hartmann-ao-simulation"
version = "0.1.0"
description = "Compact Python simulations for Shack-Hartmann wavefront sensing and adaptive optics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xu Han" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=1.5",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]
test = [
    "pytest>=8.0",
]
docs = [
    "reportlab>=4.0",
]

[tool.setuptools]
py-modules = [
    "ao_closed_loop",
    "ao_conditions",
    "ao_diagnostics",
    "ao_error_budget",
    "ao_integration",
    "ao_validation",
    "atmosphere_profiles",
    "data_sources",
    "dm_model",
    "interaction_matrix",
    "phase_screen",
    "psf_tools",
    "pwfs_forward",
    "reconstruction",
    "shwfs_detector",
    "synthetic_instrument_data",
    "zernike",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
