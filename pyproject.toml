[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shack-hartmann-ao-simulation"
version = "0.1.0"
description = "Compact Python simulations for Shack-Hartmann wavefront sensing and adaptive optics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "DATA_LICENSES.md"]
authors = [{ name = "Xu Han" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=1.5",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]
notebook-test = [
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]
test = [
    "pytest>=8.0",
    "setuptools>=77",
    "wheel",
    # validation.regression validates artifacts against the packaged JSON
    # schemas through jsonschema.  Without it here the schema tests silently
    # importorskip, so the extra would advertise coverage it does not install.
    "jsonschema>=4.21",
]
hcipy = [
    "hcipy>=0.7,<0.8",
]
docs = [
    "reportlab>=4.0",
]
lint = [
    "ruff>=0.15",
    "mypy>=2.3",
]

[project.urls]
Repository = "https://github.com/xhvoid/Shack-Hartmann-AO-Simulation"
Issues = "https://github.com/xhvoid/Shack-Hartmann-AO-Simulation/issues"

[tool.setuptools]
package-dir = {"" = "src", "build_support" = "build_support"}
py-modules = [
    "ao_closed_loop",
    "ao_conditions",
    "ao_diagnostics",
    "ao_error_budget",
    "ao_integration",
    "ao_validation",
    "atmosphere_profiles",
    "config_hashing",
    "data_sources",
    "dm_model",
    "interaction_matrix",
    "phase_screen",
    "psf_tools",
    "pwfs_forward",
    "reconstruction",
    "runtime_resources",
    "shwfs_detector",
    "synthetic_instrument_data",
    "zernike",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["shwfs_ao*"]
namespaces = false

[tool.setuptools.cmdclass]
build_py = "build_support.resource_alias.BuildPyWithResourceAlias"
editable_wheel = "build_support.resource_alias.EditableWheelWithResourceAlias"

[tool.setuptools.package-data]
"shwfs_ao.resources" = [
    "README.md",
    "deprecation_clock.json",
    "deprecation_inventory.json",
    "public/README.md",
    "public/*.csv",
    "public/*.json",
    "samples/*.csv",
    "samples/*.json",
    "reference_metrics/*.csv",
    "reference_metrics/*.json",
    "reference_metrics/cross_backend/*.json",
    "literature_profiles/*.json",
    "synthetic_presets/*.json",
    "schemas/*.json",
    "resource_manifest.json",
]
"shwfs_ao.resources.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "hcipy: requires the optional HCIPy backend dependency (deselected in native CI)",
    "slow: long-running; excluded from fast CI selections",
]

[tool.ruff]
# Archived legacy notebooks and the virtual environment are never linted.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# AO-REF-020 lint gate: the Ruff default correctness set, stated explicitly
# (pyflakes plus the pycodestyle error classes Ruff enables by default).
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Compatibility facades and installed top-level shims import names purely to
# re-export them; unused-import findings there are the mechanism, not a bug.
"src/shwfs_ao/legacy/**" = ["F401"]
"src/*.py" = ["F401"]
# Examples select the Agg backend, and tests/scripts probe optional
# dependencies, before the remaining imports; E402 is intentional there.
"examples/**" = ["E402"]
"scripts/**" = ["E402"]
"tests/**" = ["E402"]

[tool.mypy]
# AO-REF-020 static type gate.  It now covers the whole first-party package
# tree: the public protocols and unit-typed result/geometry contracts under
# shwfs_ao.core, the public SCAO factory protocol and both built-in backend
# factories, and every other runtime module (control, calibration, detector,
# wfs, science, io, dm, experiments, and the frozen legacy compatibility
# surface).  follow_imports = silent still keeps third-party dependency trees
# out of scope.  Shrinking the checked set needs a ticket.
files = [
    "src/shwfs_ao",
]
follow_imports = "silent"
python_version = "3.14"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Third-party scientific dependencies that ship no type information (no py.typed
# marker and no stub package).  Treat their imported names as Any rather than
# letting an untyped-import error mask the first-party type checking that this
# gate exists to enforce.
[[tool.mypy.overrides]]
module = [
    "hcipy.*",
    "scipy.*",
    "jsonschema",
]
ignore_missing_imports = true
