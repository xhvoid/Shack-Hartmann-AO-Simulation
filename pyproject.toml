[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shack-hartmann-ao-simulation"
version = "0.1.0"
description = "Shack-Hartmann sensing and adaptive-optics simulations for learning and investigation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "DATA_LICENSES.md"]
authors = [{ name = "Xu Han" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=1.5",
]

[project.optional-dependencies]
test = ["pytest>=8"]
hcipy = ["hcipy>=0.7,<0.8"]
validation = ["jsonschema>=4.21"]

[project.urls]
Website = "https://xhvoid.github.io/Shack-Hartmann-AO-Simulation/"
Repository = "https://github.com/xhvoid/Shack-Hartmann-AO-Simulation"
Issues = "https://github.com/xhvoid/Shack-Hartmann-AO-Simulation/issues"

[tool.setuptools]
package-dir = {"" = "src", "build_support" = "build_support"}
py-modules = [
    "ao_closed_loop",
    "ao_conditions",
    "ao_diagnostics",
    "ao_error_budget",
    "ao_integration",
    "ao_validation",
    "atmosphere_profiles",
    "config_hashing",
    "data_sources",
    "dm_model",
    "interaction_matrix",
    "phase_screen",
    "psf_tools",
    "pwfs_forward",
    "reconstruction",
    "runtime_resources",
    "shwfs_detector",
    "synthetic_instrument_data",
    "zernike",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["shwfs_ao*"]
namespaces = false

[tool.setuptools.cmdclass]
build_py = "build_support.resource_alias.BuildPyWithResourceAlias"
editable_wheel = "build_support.resource_alias.EditableWheelWithResourceAlias"

[tool.setuptools.package-data]
# Keep resource licence links valid in the installed package.
"shwfs_ao" = ["DATA_LICENSES.md"]
"shwfs_ao.resources" = [
    "README.md",
    "deprecation_clock.json",
    "deprecation_inventory.json",
    "public/README.md",
    "public/*.csv",
    "public/*.json",
    "samples/*.csv",
    "samples/*.json",
    "reference_metrics/*.csv",
    "reference_metrics/*.json",
    "reference_metrics/cross_backend/*.json",
    "literature_profiles/*.json",
    "synthetic_presets/*.json",
    "benchmarks/*.json",
    "schemas/*.json",
    "resource_manifest.json",
]
"shwfs_ao.resources.schemas" = ["*.json"]
