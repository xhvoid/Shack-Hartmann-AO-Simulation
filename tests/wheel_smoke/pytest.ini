## Configuration for the portable wheel-smoke bundle prepared by
## scripts/prepare_wheel_smoke_bundle.py.  The bundle has no pyproject.toml,
## so the strict marker registry is repeated here and must stay in sync with
## [tool.pytest.ini_options] in the repository pyproject.toml.
[pytest]
addopts = --strict-markers
markers =
    hcipy: requires the optional HCIPy backend dependency (deselected in native CI)
    slow: long-running; excluded from fast CI selections
